<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Small Promo Tile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 440px;
      height: 280px;
      background-color: #050814;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.18) 0%, transparent 80%),
        radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .logo-container {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #0b0f19;
      border: 1.5px solid rgba(6, 182, 212, 0.4);
      box-shadow: 
        0 8px 24px rgba(0, 0, 0, 0.5),
        0 0 20px rgba(6, 182, 212, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      z-index: 10;
    }

    .logo-container img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 800;
      margin: 0 0 6px 0;
      text-align: center;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      z-index: 10;
    }

    p.tagline {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
      margin: 0 0 16px 0;
      line-height: 1.4;
      max-width: 320px;
      z-index: 10;
    }

    .badges {
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-primary {
      background: rgba(6, 182, 212, 0.1);
      border-color: rgba(6, 182, 212, 0.2);
      color: #22d3ee;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="../assets/icons/icon128.png" alt="llms.txt Generator logo">
  </div>
  <h1>llms.txt Generator</h1>
  <p class="tagline">Check if websites have an llms.txt index file or generate structured markdown directories client-side instantly.</p>
  <div class="badges">
    <span class="badge badge-primary">Client-Side</span>
    <span class="badge">Sitemap Crawler</span>
    <span class="badge">Editor</span>
  </div>
</body>
</html>
